name: skill

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill structure
        run: bash scripts/validate_skill.sh

      - name: Package skill
        run: bash scripts/package_skill.sh superwriter.skill

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: superwriter-skill
          path: superwriter.skill
          if-no-files-found: error

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill structure
        run: bash scripts/validate_skill.sh

      - name: Package skill
        run: bash scripts/package_skill.sh superwriter.skill

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="\`superwriter.skill\` — upload to Claude via Customize → Skills → Create skill → Upload a skill. Built from \`superwriter/\` at ${tag} and validated by \`scripts/validate_skill.sh\`."
          gh release create "$tag" superwriter.skill \
            --title "$tag" \
            --notes "$notes"
